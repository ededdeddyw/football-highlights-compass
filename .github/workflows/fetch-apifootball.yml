name: Fetch 得点王ランキング (football-data)

# football-data.org（無料枠・現行シーズン対応）から五大リーグの得点王を取得し data/topscorers-*.json を更新。
# 要 Secrets: FOOTBALL_DATA_TOKEN。（API-Football無料枠は現行シーズン非対応のため得点王はこちらを採用）
on:
  workflow_dispatch:
    inputs:
      code:
        description: 'リーグコード（pl/laliga/sa/bl/ligue1・空で全部）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: fetch-scorers
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: 取得
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: node scripts/fetch-scorers.mjs ${{ github.event.inputs.code && format('--code={0}', github.event.inputs.code) || '' }}
      - name: データをコミット
        if: always()
        run: |
          git config user.name  "Claude"
          git config user.email "noreply@anthropic.com"
          git add data/topscorers-*.json
          if git diff --cached --quiet; then echo "変更なし。"; exit 0; fi
          git commit -m "data: 得点王ランキング取得（football-data）"
          SRC=$(git rev-parse HEAD)
          FILES=$(git diff-tree --no-commit-id --name-only -r "$SRC")
          # 他ワークフローとのpush競合対策：最新mainの上に本コミットの変更ファイルだけを載せ直してpushをリトライ
          ok=0
          for i in 1 2 3 4 5 6; do
            git fetch origin main || { sleep $(( i * 2 )); continue; }
            git checkout -B __ci_commit origin/main
            git checkout "$SRC" -- $FILES
            git add -A
            if git diff --cached --quiet; then echo "最新mainに既に反映済み。"; ok=1; break; fi
            git commit -C "$SRC"
            if git push origin HEAD:main; then ok=1; echo "push成功（$i 回目）"; break; fi
            echo "push競合、リトライ $i"; sleep $(( (RANDOM % 4) + i * 2 ))
          done
          [ "$ok" = 1 ] || echo "::warning::pushに失敗しました（データ処理は完了済み・次回実行で再試行されるため実害はありません）。"
