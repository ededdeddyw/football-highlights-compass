name: Watch WC highlights

# 安全のため既定は手動実行のみ。準備（Secrets登録＋schedule/channelId投入＋watch-config.enabled=true）が
# できたら下の schedule(cron) のコメントを外して有効化する。W杯終了後は再コメントで停止。
on:
  workflow_dispatch:
  # W杯終了に伴い自動実行を停止（2026-08）。WCハイライト検知＋本番デプロイを10分毎に回す必要がなくなったため。
  # 再開する場合は下の schedule 2行のコメントを外す。手動実行(workflow_dispatch)は引き続き可能。
  # schedule:
  #   - cron: '*/10 * * * *'   # 10分間隔（Actions cronは遅延・スキップあり＝検知窓を広めに設定済み）

permissions:
  contents: write

concurrency:
  group: ftp-deploy      # FTP差分デプロイを行うため、他のデプロイ系と同時実行しない（同一FTPサーバーへの同時書込み・push競合を回避）
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: 検知（YouTube RSS）
        run: node scripts/watch-highlights.mjs

      - name: 検知差分の判定
        id: diff
        run: |
          if git diff --quiet -- data/wc2026-detected.json; then
            echo "changed=0" >> "$GITHUB_OUTPUT"; echo "新規検知なし。";
          else
            echo "changed=1" >> "$GITHUB_OUTPUT"; echo "新規検知あり。";
          fi

      - name: index へ注入 → サイト生成
        if: steps.diff.outputs.changed == '1'
        run: |
          node scripts/inject-wc.mjs
          node scripts/build-site.mjs

      - name: FTP デプロイ（本番 highlight-compass.com）
        if: steps.diff.outputs.changed == '1'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR:  ${{ secrets.FTP_DIR }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          npm install basic-ftp --no-save --no-package-lock --no-audit --no-fund
          node scripts/deploy.mjs

      - name: コミット＆push（github.io／履歴）
        if: steps.diff.outputs.changed == '1'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html data/wc2026-detected.json data/wc2026-schedule.json data/wc-detect-candidates.json
          git commit -m "auto: W杯ハイライト自動検知・記事化" || echo "no changes"
          SRC=$(git rev-parse HEAD)
          FILES=$(git diff-tree --no-commit-id --name-only -r "$SRC")
          # 他ワークフローとのpush競合対策：最新mainの上に本コミットの変更ファイルだけを載せ直してpushをリトライ
          ok=0
          for i in 1 2 3 4 5 6; do
            git fetch origin main || { sleep $(( i * 2 )); continue; }
            git checkout -B __ci_commit origin/main
            git checkout "$SRC" -- $FILES
            git add -A
            if git diff --cached --quiet; then echo "最新mainに既に反映済み。"; ok=1; break; fi
            git commit -C "$SRC"
            if git push origin HEAD:main; then ok=1; echo "push成功（$i 回目）"; break; fi
            echo "push競合、リトライ $i"; sleep $(( (RANDOM % 4) + i * 2 ))
          done
          [ "$ok" = 1 ] || echo "::warning::pushに失敗しました（データ処理は完了済み・次回実行で再試行されるため実害はありません）。"
