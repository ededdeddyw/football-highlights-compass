name: Fetch league (五大リーグ 日程・結果の取得)

# リーグの日程・結果を OpenLigaDB 等から取得し data/league-<code>-<season>.json に保存する。
# フェーズ1はブンデス(bl)のみ。手動実行で取得→データのみコミット（本番反映は別途 deploy-ftp）。
on:
  workflow_dispatch:
    inputs:
      code:
        description: 'リーグコード（bl=ブンデス）'
        required: false
        default: 'bl'
      season:
        description: 'シーズン開始年（2025=2025-26）'
        required: false
        default: '2025'

permissions:
  contents: write

concurrency:
  group: fetch-league
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: 取得
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: node scripts/fetch-league.mjs "${{ github.event.inputs.code }}" "${{ github.event.inputs.season }}"
      - name: データをコミット
        run: |
          git config user.name  "Claude"
          git config user.email "noreply@anthropic.com"
          git add data/league-*.json
          if git diff --cached --quiet; then echo "変更なし。"; exit 0; fi
          git commit -m "data: リーグ日程・結果を取得（fetch-league）"
          SRC=$(git rev-parse HEAD)
          FILES=$(git diff-tree --no-commit-id --name-only -r "$SRC")
          # 他ワークフローとのpush競合対策：最新mainの上に本コミットの変更ファイルだけを載せ直してpushをリトライ
          ok=0
          for i in 1 2 3 4 5 6; do
            git fetch origin main || { sleep $(( i * 2 )); continue; }
            git checkout -B __ci_commit origin/main
            git checkout "$SRC" -- $FILES
            git add -A
            if git diff --cached --quiet; then echo "最新mainに既に反映済み。"; ok=1; break; fi
            git commit -C "$SRC"
            if git push origin HEAD:main; then ok=1; echo "push成功（$i 回目）"; break; fi
            echo "push競合、リトライ $i"; sleep $(( (RANDOM % 4) + i * 2 ))
          done
          [ "$ok" = 1 ] || echo "::warning::pushに失敗しました（データ処理は完了済み・次回実行で再試行されるため実害はありません）。"
