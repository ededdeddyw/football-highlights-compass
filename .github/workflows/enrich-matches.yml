name: Enrich matches (独自記事の生成)

# 試合ページの独自記事（ネタバレなしの前フリ）をClaudeで生成し data/match-previews.json に反映する。
# 記事が付くとその試合ページが再index対象になる（AdSense「有用性の低いコンテンツ」対策＋SEO）。
# 自動運用: 毎日 05:00 UTC（14:00 JST）に主要大会優先で最大80件を補充。翌 06:00 UTC の season-refresh が
#   build→本番反映するため、生成した見どころは同日中に公開される（enrich自身はデプロイしない）。
#   未生成の試合が尽きると「生成対象なし」で即終了するため、バックログ消化後のコストはほぼゼロに収束する。
# 手動実行時は limit / ids で対象を絞れる（サンプル確認→段階展開）。生成物(site/)はCIで作られる。
on:
  schedule:
    - cron: '0 5 * * *'   # 毎日 14:00 JST（05:00 UTC）。見どころ記事を日次補充（nations→cl→el優先）。cron時は limit=80。
  workflow_dispatch:
    inputs:
      limit:
        description: '一度に生成する件数（記事未生成の試合から）'
        required: false
        default: '4'
      ids:
        description: '対象を特定IDに限定する場合（カンマ区切り・任意）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: enrich-matches
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: 依存導入（undici=タイムアウト延長用）
        run: npm install undici --no-save --no-package-lock --no-audit --no-fund

      - name: 試合インデックスを生成（build）
        run: node scripts/build-site.mjs

      # 生成ステップは16分で打ち切る（ジョブ全体20分より短く）。打ち切られても後続で生成済み分を必ずコミットする。
      - name: 独自記事を生成（enrich）
        timeout-minutes: 45
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          RUN_DATE: ${{ github.run_id }}
        run: node scripts/enrich-matches.mjs --limit=${{ github.event.inputs.limit || '80' }} ${{ github.event.inputs.ids && format('--ids={0}', github.event.inputs.ids) || '' }}

      - name: 記事をページに反映（再build）
        if: always()
        run: node scripts/build-site.mjs

      - name: データをコミット（match-previews.json 等）
        if: always()
        run: |
          git config user.name  "Claude"
          git config user.email "noreply@anthropic.com"
          git add data/match-previews.json data/matches-index.json
          if git diff --cached --quiet; then echo "変更なし。"; exit 0; fi
          git commit -m "content: 試合ページの独自記事を生成（enrich-matches）"
          git pull --rebase --autostash || true
          git push
