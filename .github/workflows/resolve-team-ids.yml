name: Resolve club TheSportsDB IDs (プレシーズン取得の下準備)

# 既存クラブ(entities.mjs)をTheSportsDBのチームIDに解決してdata/club-tsdb-ids.jsonへ保存する。
# 手動実行。結果はコミットするが、要確認(候補複数/該当なし)が残る場合は手動で見直してから
# fetch-preseason.mjs を使うこと。
on:
  workflow_dispatch:
    inputs:
      force:
        description: '解決済みのクラブも再解決する（通常はfalseのまま。未解決分だけ再試行）'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: resolve-team-ids
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: 解決
        run: node scripts/resolve-team-ids.mjs ${{ github.event.inputs.force == 'true' && '--force' || '' }}
      - name: データをコミット
        run: |
          git config user.name  "Claude"
          git config user.email "noreply@anthropic.com"
          git add data/club-tsdb-ids.json
          if git diff --cached --quiet; then echo "変更なし。"; exit 0; fi
          git commit -m "data: クラブのTheSportsDBチームIDを解決（resolve-team-ids）"
          SRC=$(git rev-parse HEAD)
          FILES=$(git diff-tree --no-commit-id --name-only -r "$SRC")
          # 他ワークフローとのpush競合対策：最新mainの上に本コミットの変更ファイルだけを載せ直してpushをリトライ
          ok=0
          for i in 1 2 3 4 5 6; do
            git fetch origin main || { sleep $(( i * 2 )); continue; }
            git checkout -B __ci_commit origin/main
            git checkout "$SRC" -- $FILES
            git add -A
            if git diff --cached --quiet; then echo "最新mainに既に反映済み。"; ok=1; break; fi
            git commit -C "$SRC"
            if git push origin HEAD:main; then ok=1; echo "push成功（$i 回目）"; break; fi
            echo "push競合、リトライ $i"; sleep $(( (RANDOM % 4) + i * 2 ))
          done
          [ "$ok" = 1 ] || echo "::warning::pushに失敗しました（データ処理は完了済み・次回実行で再試行されるため実害はありません）。"
