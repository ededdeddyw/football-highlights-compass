name: Fetch preseason (プレシーズン/親善試合の取得)

# 追跡中クラブ(resolve-team-ids.mjsで解決済み)のプレシーズン・親善試合を
# TheSportsDBから取得し data/preseason-<season>.json に保存する。手動実行。
on:
  workflow_dispatch:
    inputs:
      season:
        description: 'シーズン(プレシーズンの年。例: 2026年夏なら2026)'
        required: false
        default: '2026'
      force:
        description: '取得済みのクラブも再取得する'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: fetch-preseason
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: 取得
        run: node scripts/fetch-preseason.mjs "${{ github.event.inputs.season }}" ${{ github.event.inputs.force == 'true' && '--force' || '' }}
      - name: データをコミット
        run: |
          git config user.name  "Claude"
          git config user.email "noreply@anthropic.com"
          git add data/preseason-*.json
          if git diff --cached --quiet; then echo "変更なし。"; exit 0; fi
          git commit -m "data: プレシーズン/親善試合を取得（fetch-preseason）"
          git pull --rebase --autostash || true
          git push
