name: Prune orphans (残存ページ掃除・本番FTP)

# 過去にアップしたが現行ビルドに存在しない残存ページ（match/・matchday/ のみ）を本番から削除する。
# 既定はドライラン（一覧のみ）。実削除は手動実行で apply=true を指定したときだけ。
on:
  workflow_dispatch:
    inputs:
      apply:
        description: '実削除する場合は true（既定 false＝ドライラン）'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: ftp-deploy       # デプロイ系と同一枠＝同時FTP・push競合を回避
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: サイト生成（現行ファイル集合の確定に必須）
        run: node scripts/build-site.mjs

      - name: 残存ページを削除（既定ドライラン）
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR:  ${{ secrets.FTP_DIR }}
          SITE_URL: ${{ secrets.SITE_URL }}
          PRUNE_APPLY: ${{ github.event.inputs.apply == 'true' && '1' || '0' }}
        run: |
          npm install basic-ftp --no-save --no-package-lock --no-audit --no-fund
          node scripts/prune-orphans.mjs

      - name: マニフェストをコミット（削除反映・apply時のみ変化）
        if: always() && github.event.inputs.apply == 'true'
        run: |
          git config user.name  "Claude"
          git config user.email "noreply@anthropic.com"
          git add data/deploy-manifest.json || true
          if git diff --cached --quiet; then echo "変更なし。"; exit 0; fi
          git commit -m "chore(prune): 残存ページ削除をマニフェストに反映"
          SRC=$(git rev-parse HEAD)
          FILES=$(git diff-tree --no-commit-id --name-only -r "$SRC")
          ok=0
          for i in 1 2 3 4 5 6; do
            git fetch origin main || { sleep $(( i * 2 )); continue; }
            git checkout -B __prune_commit origin/main
            git checkout "$SRC" -- $FILES
            git add -A
            if git diff --cached --quiet; then echo "最新mainに既に反映済み。"; ok=1; break; fi
            git commit -C "$SRC"
            if git push origin HEAD:main; then ok=1; echo "push成功（$i 回目）"; break; fi
            echo "push競合、リトライ $i"; sleep $(( (RANDOM % 4) + i * 2 ))
          done
          [ "$ok" = 1 ] || echo "::warning::マニフェストpush失敗（削除は完了済み・次回デプロイで整合）。"
