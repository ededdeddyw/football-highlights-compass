name: Diff FTP deploy (差分のみ・高速)

# コード/CSSの小さな変更を本番へ「差分だけ」高速アップロードする。
# deploy-ftp.yml（全アップロード）は648ページで時間がかかり、FTPのタイムアウトで固まりやすい。
# こちらは data/deploy-manifest.json と比較して変わったファイルだけ上げ、更新後のマニフェストをコミットする。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: サイト生成
        run: node scripts/build-site.mjs

      - name: FTP 差分デプロイ（変更ファイルのみ）
        timeout-minutes: 50   # テンプレ変更日（数千ページ一括）でも1回で完走できるよう拡大。deploy.mjsはマニフェスト再開式なので途中終了しても次回続行
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR:  ${{ secrets.FTP_DIR }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          npm install basic-ftp --no-save --no-package-lock --no-audit --no-fund
          node scripts/deploy.mjs

      - name: マニフェストをコミット（次回の差分判定用）
        if: always()
        run: |
          git config user.name  "Claude"
          git config user.email "noreply@anthropic.com"
          git add data/deploy-manifest.json data/page-modified.json || true
          if git diff --cached --quiet; then echo "変更なし。"; exit 0; fi
          git commit -m "chore(deploy): デプロイ差分マニフェスト・更新日マップ更新"
          SRC=$(git rev-parse HEAD)   # 自分のマニフェスト内容を保持（直前のアップロードを反映した最新版）
          # season-refresh 等が同じ生成ファイルを並行更新するため push が競合しやすい。
          # 「最新 main を取得 → その上に自分の2ファイルだけを載せ直して単一コミット → push」をリトライ。
          # 毎回 origin/main から作り直すので rebase 競合は起きず、非fast-forward はリトライで解消する。
          ok=0
          for i in 1 2 3 4 5 6; do
            git fetch origin main || { sleep $(( i * 2 )); continue; }
            git checkout -B __deploy_manifest origin/main
            git checkout "$SRC" -- data/deploy-manifest.json data/page-modified.json
            git add data/deploy-manifest.json data/page-modified.json
            if git diff --cached --quiet; then echo "最新mainに既に反映済み。"; ok=1; break; fi
            git commit -m "chore(deploy): デプロイ差分マニフェスト・更新日マップ更新"
            if git push origin HEAD:main; then ok=1; echo "push成功（$i 回目）"; break; fi
            echo "push競合、リトライ $i"; sleep $(( (RANDOM % 4) + i * 2 ))
          done
          if [ "$ok" != 1 ]; then
            echo "::warning::マニフェストのpushに失敗しました（本番へのアップロードは完了済み。次回デプロイで差分が再計算・再コミットされるため実害はありません）。"
          fi
