<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>(function(){try{if(location.hostname==='ededdeddyw.github.io'){var p=location.pathname.replace(/^\/football-highlights-compass/,'')||'/';location.replace('https://highlight-compass.com'+p+location.search+location.hash);return;}
// 旧「/match/<videoId>.html」URL（索引・ブックマーク由来）は、現在はクリーンslug（例 /match/bl-2526-md4-…）に統一済み。
// リダイレクトマップを参照し、該当すれば正規ページへ自動で飛ばす（無ければ通常の404表示）。
var m=location.pathname.match(/\/match\/([A-Za-z0-9_-]{6,})\.html$/);
if(m){var id=m[1];fetch('/match-redirects.json').then(function(r){return r.ok?r.json():null;}).then(function(map){if(map&&map[id]){location.replace('/match/'+map[id]+'.html');}}).catch(function(){});}
}catch(e){}})();</script>
<title>ページが見つかりません（404） - Football Highlights Compass</title>
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#0c1657">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root{--bg:#eef2fb;--card:#fff;--ink:#0c1657;--muted:#5b6790;--accent:#1b2a78;--line:#d2dcf0}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Helvetica Neue",Helvetica,Arial,sans-serif;padding:24px}
  .box{max-width:520px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:40px 28px;box-shadow:0 10px 30px rgba(16,26,86,.12)}
  .code{font-size:64px;font-weight:900;letter-spacing:.04em;color:var(--accent);line-height:1;margin:0 0 6px}
  h1{font-size:20px;font-weight:800;margin:0 0 12px}
  p{font-size:14.5px;line-height:1.9;color:var(--muted);margin:0 0 22px}
  .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  a.btn{display:inline-block;text-decoration:none;font-weight:800;font-size:14px;padding:12px 20px;border-radius:10px}
  a.primary{background:var(--accent);color:#fff}
  a.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
  a.btn:hover{opacity:.9}
</style>
</head><body>
  <div class="box">
    <p class="code">404</p>
    <h1>ページが見つかりません</h1>
    <p>お探しのページは移動または削除された可能性があります。<br>トップやサイト内検索から、公式ハイライト（5大リーグ・CL/EL・代表・Jリーグ など）を探せます。</p>
    <div class="btns">
      <a class="btn primary" href="/">▶ トップで試合を探す</a>
      <a class="btn ghost" href="/search.html">🔍 サイト内検索</a>
      <a class="btn ghost" href="/latest/">🆕 最新ハイライト</a>
    </div>
  </div>
</body></html>
